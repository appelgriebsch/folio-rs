name: deploy

# Deploys only on pushes to main — never from pull requests, so no
# Cloudflare credentials are ever exposed to PR CI (ci.yml has none either).
# workflow_dispatch allows a manual run (e.g. a prod re-deploy after approval).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_VERSION: 4.158.0
  SMOKE_SOURCE_URL: https://example.com/

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install worker-build --locked --version 0.1.14
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - run: echo "WASM_BINDGEN_BIN=$HOME/.cargo/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - run: worker-build --release
        working-directory: worker
      - run: npm install --no-save "wrangler@${{ env.WRANGLER_VERSION }}"
      - name: Deploy staging
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGING_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGING_CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/wrangler-deploy.log
          grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1 > /tmp/staging_url
          if ! test -s /tmp/staging_url; then
            echo "no *.workers.dev URL in wrangler output — configure a custom domain or check the deploy log" >&2
            exit 1
          fi
      - name: Smoke staging
        run: |
          URL=$(cat /tmp/staging_url)
          echo "smoke base: $URL"
          test "$(curl -fsS "$URL/health")" = "ok"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/?sourceUrl=${{ env.SMOKE_SOURCE_URL }}&format=pdf")
          echo "epub-only route, format=pdf -> $code (want 400)"
          test "$code" = 400
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$URL/pdf" -H 'Content-Type: application/json' -d "{\"sourceUrl\":\"${{ env.SMOKE_SOURCE_URL }}\"}")
          echo "POST /pdf without bearer -> $code (want 401)"
          test "$code" = 401
          code=$(curl -s -o /tmp/smoke.epub -w '%{http_code}' "$URL/?sourceUrl=${{ env.SMOKE_SOURCE_URL }}&format=epub")
          echo "epub generate -> $code (want 200, or 422 if the page has no article)"
          if test "$code" = 200; then
            head -c 2 /tmp/smoke.epub | grep -q PK
          else
            test "$code" = 422
          fi

  production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo install worker-build --locked --version 0.1.14
      - run: cargo install wasm-bindgen-cli --locked --version 0.2.130
      - run: echo "WASM_BINDGEN_BIN=$HOME/.cargo/bin/wasm-bindgen" >> "$GITHUB_ENV"
      - run: worker-build --release
        working-directory: worker
      - run: npm install --no-save "wrangler@${{ env.WRANGLER_VERSION }}"
      - name: Deploy production
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PRODUCTION_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PRODUCTION_CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --env production
