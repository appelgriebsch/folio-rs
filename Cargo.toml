[package]
name = "folio-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Fetch one web article and write an EPUB or a PDF"
publish = false

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
ammonia = "4"
dom_query = "0.27"
dom_smoothie = "0.18"
encoding_rs = "0.8"
ab_glyph = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
reqwest = { version = "0.13", default-features = false }
rbook = "0.7"
serde_json = "1"
thiserror = "2"
unicode-linebreak = "0.1"
unicode-normalization = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# Native-only dependencies: the CLI binary, its interrupt handler, and the
# printpdf-based PDF renderer do not compile to wasm32-unknown-unknown.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
printpdf = { version = "0.12.8", default-features = false, features = ["html", "jpeg", "png", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

[dev-dependencies]
printpdf = { version = "0.12.8", default-features = false, features = ["html", "jpeg", "png", "gif"] }
xmlparser = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }

# Raster, resize, and JPEG dominate cover tests. Optimise those crates in dev.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.ab_glyph_rasterizer]
opt-level = 3

# HTML layout is the slow part of a debug PDF render.
[profile.dev.package.azul-layout]
opt-level = 3

[profile.dev.package.azul-core]
opt-level = 3

[profile.dev.package.azul-css]
opt-level = 3

[profile.dev.package.allsorts-azul]
opt-level = 3

[profile.dev.package.printpdf]
opt-level = 3

[profile.dev.package.rust-fontconfig]
opt-level = 3
