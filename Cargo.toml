[package]
name = "folio-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Fetch one web article and write an EPUB"
publish = false

[[bin]]
name = "folio"
path = "src/main.rs"

[dependencies]
ammonia = "4"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dom_query = "0.27"
dom_smoothie = "0.18"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rbook = "0.7"
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
url = "2"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
