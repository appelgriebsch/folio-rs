name = "folio"
main = "build/worker/shim.mjs"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# PDF output is rendered from the composed article by a headless browser.
# Requires the Browser Rendering product on the account.
[browser]
binding = "BROWSER"

# Ship gate: the generate routes check this binding per client IP and answer
# 429 when over the limit. The Worker answers 500 if the binding is missing.
[[ratelimits]]
name = "GENERATE_LIMIT"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Deploy targets (deploy.yml): staging deploys on push to main, production
# via the GitHub `production` environment approval. Each env gets its own
# Worker name, BROWSER binding, and rate-limit namespace.
[env.staging]
name = "folio-staging"

[env.staging.browser]
binding = "BROWSER"

[[env.staging.ratelimits]]
name = "GENERATE_LIMIT"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[env.production]
name = "folio"

[env.production.browser]
binding = "BROWSER"

[[env.production.ratelimits]]
name = "GENERATE_LIMIT"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
